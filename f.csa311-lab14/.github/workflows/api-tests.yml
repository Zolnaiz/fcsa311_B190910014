name: API Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install

      - name: Run API tests
        run: npx newman run postman/collection.json -e postman/env.ci.json